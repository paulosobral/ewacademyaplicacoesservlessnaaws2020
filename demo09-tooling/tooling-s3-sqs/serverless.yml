service: tooling-s3-sqs



provider:
  name: aws
  runtime: nodejs12.x

plugins:
  - serverless-localstack
  - serverless-mocha-plugin
  - serverless-offline

custom:
  serverless-offline:
    useChildProcesses: true

functions:
  hello:
    handler: index.handler
    events:
      - http:
          method: get
          path: hello